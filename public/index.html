    <!--
      Cobertura nacional y precios en los datos estructurados. Los precios salen
      de utils/contenido.js y un test falla si se desincronizan. Al fijaar el
      dominio, cambia las rutas relativas (/favicon.png) por absolutas.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Nebula",
            "inLanguage": "es-MX",
            "description": "Software de pedidos e inventario para restaurantes, cafeterías y bares en México."
          },
          {
            "@type": "Organization",
            "name": "Nebula",
            "url": "/",
            "logo": "/favicon.png",
            "description": "Software de pedidos e inventario para restaurantes, cafeterías y bares en México.",
            "areaServed": {
              "@type": "Country",
              "name": "México"
            },
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "sales",
              "telephone": "+529991778325",
              "availableLanguage": "es-MX",
              "areaServed": "MX"
            }
          },
          {
            "@type": "SoftwareApplication",
            "name": "Nebula",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "inLanguage": "es-MX",
            "description": "Nebula organiza el pedido de principio a fin: seguimiento con estado y responsable, menú por categorías, inventario que se descuenta solo y analíticas de ventas. Sin comisión por pedido. Disponible en toda la República Mexicana.",
            "areaServed": {

              "name": "México"
            },
            "offers": [
              {
                "@type": "Offer",
                "name": "Nebula Básico",
                "description": "Todo tu menú y tus pedidos en un solo lugar, sin comisión por pedido.",
                "price": "599",
                "priceCurrency": "MXN",
                "availability": "https://schema.org/InStock",
                "areaServed": {
                  "@type": "Country",
                  "name": "México"
                }
              }
            ]
          }
        ]
      }
    </script>

    <!--
      El dominio todavia no esta fijo en el codigo, asi que canonical, og:url y
      la imagen para compartir se arman con el host desde el que se sirve la
      pagina. Cuando exista el dominio definitivo, quita este script y deja las
      tres etiquetas con la URL absoluta.

      Ademas devuelve la ruta que pidio public/404.html: GitHub Pages responde
      404 a /planes y /cobertura, esa pagina guarda la URL y redirige aqui, y
      con esto React abre en la ruta correcta sin recargar.
    -->
    <script>
      (function () {
        var origen = window.location.origin;
        var ruta = window.location.pathname;

        try {
          var pedida = sessionStorage.getItem("nebula:redirect");
          if (pedida) {
            sessionStorage.removeItem("nebula:redirect");
            var destino = new URL(pedida);
            // solo rutas propias: nada de archivos de /static ni de otros sitios
            if (
              destino.host === window.location.host &&
              destino.pathname.indexOf("/static/") === -1
            ) {
              ruta = destino.pathname + destino.search + destino.hash;
            }
          }
        } catch (error) {
          // sin sessionStorage el sitio abre en la ruta de la barra
        }

        var canonico = document.createElement("link");
        canonico.rel = "canonical";
        canonico.href = origen + ruta;
        document.head.appendChild(canonico);

        // React todavia no ha montado: se devuelve la ruta pedida antes de que
        // lea el router, para que /planes abra en /planes y no en la raiz.
        if (ruta !== window.location.pathname) {
          window.history.replaceState(null, "", ruta);
        }

        var ogUrl = document.querySelector('meta[property="og:url"]');
        if (ogUrl) ogUrl.setAttribute("content", origen + ruta);

        // data-src ya trae %PUBLIC_URL% resuelto; si quedo absoluta se usa tal cual
        var absoluta = function (ruta) {
          return /^https?:/.test(ruta) ? ruta : origen + ruta;
        };

        var ogImagen = document.querySelector('meta[property="og:image"]');
        if (ogImagen) {
          ogImagen.setAttribute(
            "content",
            absoluta(ogImagen.getAttribute("data-src"))
          );
        }

        var twImagen = document.querySelector('meta[name="twitter:image"]');
        if (twImagen) {
          twImagen.setAttribute(
            "content",
            absoluta(twImagen.getAttribute("data-src"))
          );
        }
      })();
    </script>
