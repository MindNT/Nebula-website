name: Deploy del sitio a GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub Pages solo sirve un deploy a la vez: no se cancela el que esta
# subiendo archivos porque podria quedar el sitio a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 es la version con la que se desarrolla y se prueba el sitio
      # (npm 11). npm ci exige que el lock y la version de npm coincidan: con
      # npm 10 el lock no cuadra y el deploy se cae.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # CI=true convierte cualquier warning de ESLint en error: si el sitio
      # compila aqui, compila en el deploy.
      - run: CI=true npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
